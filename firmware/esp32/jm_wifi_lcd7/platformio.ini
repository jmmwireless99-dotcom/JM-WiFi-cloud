; BANKERO LCD7 — PlatformIO (terminal flash, COM6)
; Run: pio run -t upload

[platformio]
src_dir = .

[env:lcd7s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
board_build.usb_mode = cdc
board_build.usb_cdc_on_boot = enabled
lib_deps = bblanchon/ArduinoJson@^7.0.0
