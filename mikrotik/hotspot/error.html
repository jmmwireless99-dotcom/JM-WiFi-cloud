<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JM WiFi — Error</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="brand">
      <p class="brand-name">JM WiFi</p>
      <p class="brand-domain">{{DOMAIN}}</p>
      <p class="tagline">Something went wrong</p>
    </header>
    <section class="card">
      <div class="status error">$(error)</div>
      <p class="info" style="margin-top:14px;text-align:center;">Please try again or contact the vendo operator.</p>
      <a class="btn" href="$(link-login)" style="margin-top:14px;">Back to login</a>
    </section>
    <footer class="footer"><p>Powered by JM Tech Solution</p></footer>
  </main>
</body>
</html>
