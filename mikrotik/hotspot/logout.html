<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JM WiFi — Logged out</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="shell">
    <header class="brand">
      <p class="brand-name">JM WiFi</p>
      <p class="brand-domain">{{DOMAIN}}</p>
      <p class="tagline">Session ended</p>
    </header>
    <section class="card">
      <p class="info" style="text-align:center;">You have been logged out from JM WiFi.</p>
      <a class="btn" href="$(link-login)">Login again</a>
    </section>
    <footer class="footer"><p>Powered by JM Tech Solution</p></footer>
  </main>
</body>
</html>
