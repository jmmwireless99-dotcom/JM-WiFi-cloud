<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JM TECH SOLUTION</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzPCf9ltuBAm9dVaHd/sfpsz+8=" crossorigin="" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg:#0a101c; --bg2:#0d1524; --side:#0c1422; --card:#121a2b; --card2:#162235;
    --line:#1e2a3d; --line2:#2a3a52; --txt:#e8eef6; --dim:#8b9cb3;
    --acc:#3b82f6; --acc2:#2563eb; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --shadow:0 8px 28px rgba(0,0,0,.35); --r:12px; --side-w:248px;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; color:var(--txt);
    font:14.5px/1.5 "IBM Plex Sans",Segoe UI,sans-serif;
    background:var(--bg);
  }
  .shell { display:flex; min-height:100vh; background:var(--bg); }
  .sidebar {
    width:var(--side-w); flex-shrink:0; background:var(--side);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; z-index:40; padding:18px 14px;
  }
  .sidebar .side-brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .sidebar .side-brand img { height:36px; width:auto; object-fit:contain; }
  .sidebar .side-brand .sb-t { font-size:13px; font-weight:700; letter-spacing:.02em; line-height:1.25; }
  .sidebar .side-brand .sb-s { font-size:11px; color:var(--dim); font-weight:500; }
  .nav { display:flex; flex-direction:column; gap:4px; flex:1; overflow:auto; }
  .nav button {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; color:var(--dim); border:0; border-radius:10px;
    padding:10px 12px 10px 14px; font-weight:600; font-size:13px; position:relative;
    box-shadow:none; transform:none; filter:none;
  }
  .nav button:hover:not(:disabled) {
    color:var(--txt); background:rgba(255,255,255,.04); transform:none; filter:none;
  }
  .nav button.act {
    color:var(--txt); background:rgba(59,130,246,.12);
    box-shadow:none;
  }
  .nav button.act::before {
    content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
    border-radius:0 3px 3px 0; background:var(--acc);
  }
  .nav .nav-sec {
    font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
    padding:14px 12px 6px; font-weight:650;
  }
  .nav a.nav-ext {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    color:var(--dim); border-radius:10px; padding:10px 12px 10px 14px;
    font-weight:600; font-size:13px; text-decoration:none;
  }
  .nav a.nav-ext:hover { color:var(--txt); background:rgba(255,255,255,.04); }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .main > .topbar {
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:14px;
    padding:12px 22px; background:rgba(10,16,28,.92);
    border-bottom:1px solid var(--line); backdrop-filter:blur(10px);
  }
  .menu-btn {
    display:none; background:rgba(59,130,246,.1); color:var(--txt);
    border:1px solid var(--line2); border-radius:8px; padding:8px 10px; font-size:16px;
  }
  .menu-btn:hover:not(:disabled) { filter:none; transform:none; background:rgba(59,130,246,.18); }
  .top-search {
    flex:1; max-width:420px; margin:0 auto;
    background:rgba(18,26,43,.9) !important; border:1px solid var(--line) !important;
    border-radius:999px !important; padding:10px 18px !important; text-align:center;
  }
  .top-search:focus { border-color:var(--acc) !important; box-shadow:0 0 0 3px rgba(59,130,246,.18) !important; }
  .topbar-right { display:flex; align-items:center; gap:10px; margin-left:auto; }
  .avatar {
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#fff;
  }
  .content { padding:22px 24px 40px; max-width:1400px; width:100%; margin:0 auto; }
  .page-head { margin-bottom:18px; }
  .page-head h1 { font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .page-head .crumb { color:var(--dim); font-size:12.5px; margin-top:4px; }
  .dash-grid {
    display:grid; grid-template-columns:repeat(12,1fr); gap:14px; margin-bottom:18px;
  }
  .metric {
    grid-column:span 3; background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px;
    box-shadow:0 4px 16px rgba(0,0,0,.2); position:relative; overflow:hidden;
  }
  .metric.wide { grid-column:span 6; }
  .metric .ml { color:var(--dim); font-size:12px; font-weight:600; }
  .metric .mv { font-size:28px; font-weight:750; letter-spacing:-.03em; margin:6px 0 4px; }
  .metric .ms { font-size:12px; color:var(--dim); }
  .trend.up { color:var(--ok); }
  .trend.down { color:var(--bad); }
  .spark {
    height:36px; margin-top:10px; display:flex; align-items:flex-end; gap:3px;
  }
  .spark i {
    flex:1; display:block; border-radius:2px 2px 0 0;
    background:linear-gradient(180deg,rgba(59,130,246,.55),rgba(59,130,246,.15));
    height:var(--h,40%);
  }
  .bars {
    display:flex; align-items:flex-end; gap:4px; height:40px; margin-top:10px;
  }
  .bars span {
    flex:1; border-radius:3px 3px 0 0;
    background:rgba(34,197,94,.35); height:var(--h,50%);
  }
  .quick-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .quick {
    background:linear-gradient(165deg,rgba(28,45,66,.95),rgba(15,26,40,.98));
    border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .quick:hover { border-color:rgba(59,130,246,.55); transform:translateY(-2px); }
  .quick b { display:block; font-size:14px; margin-bottom:4px; }
  .quick span { color:var(--dim); font-size:12px; }
  .login-wrap {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:
      radial-gradient(800px 400px at 20% 0%, rgba(59,130,246,.12), transparent 55%),
      radial-gradient(600px 360px at 90% 10%, rgba(34,197,94,.06), transparent 50%),
      var(--bg);
  }
  h1 { font-size:20px; font-weight:700; letter-spacing:-.01em; }
  h3 { font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .panel {
    background:linear-gradient(180deg, rgba(22,34,53,.92), rgba(18,26,43,.96));
    border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    box-shadow:var(--shadow); backdrop-filter:blur(8px);
  }
  .card {
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid var(--line); border-radius:var(--r); padding:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.16);
  }
  .grid { display:grid; gap:14px; }
  .g-tiles { grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .g-vpn { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .g-cams { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .tile.vpn-sq {
    aspect-ratio:1/1; display:flex; flex-direction:column; justify-content:space-between;
    min-height:0; padding:18px;
  }
  .tile.vpn-sq .n { font-size:15px; word-break:break-word; line-height:1.25; }
  .tile.vpn-sq .c { font-size:11.5px; line-height:1.45; }
  .tile.vpn-sq .vpn-actions { display:flex; gap:8px; margin-top:auto; padding-top:12px; flex-wrap:wrap; }
  .g-devices { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }
  .tile.device-card {
    min-height:140px; display:flex; flex-direction:column; cursor:default;
    border:1px solid var(--line); background:var(--card);
  }
  .tile.device-card .dev-id { font-size:11px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; }
  .tile.device-card .dev-name { font-size:16px; font-weight:700; color:var(--acc); margin:4px 0 8px; word-break:break-word; }
  .tile.device-card .dev-meta { font-size:12px; color:var(--dim); line-height:1.45; }
  .tile.device-card .dev-actions { display:flex; gap:8px; margin-top:auto; padding-top:12px; flex-wrap:wrap; }
  .table-wrap { overflow-x:auto; border-radius:var(--r); border:1px solid var(--line); background:var(--card); }
  table { width:100%; border-collapse:collapse; min-width:720px; }
  th,td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  th {
    color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.06em; background:rgba(10,16,28,.55); position:sticky; top:0;
  }
  tbody tr:hover td { background:rgba(59,130,246,.04); }
  .mono { font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace; font-size:12.5px; }
  .badge {
    display:inline-flex; align-items:center; gap:4px; padding:3px 9px;
    border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.02em;
  }
  .b-active,.b-ok { background:rgba(34,197,94,.14); color:var(--ok); border:1px solid rgba(34,197,94,.25); }
  .b-expired,.b-bad { background:rgba(239,68,68,.14); color:var(--bad); border:1px solid rgba(239,68,68,.25); }
  .b-disabled,.b-warn { background:rgba(245,158,11,.14); color:var(--warn); border:1px solid rgba(245,158,11,.25); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .on { background:var(--ok); box-shadow:0 0 8px rgba(34,197,94,.7); }
  .off { background:#4a5c73; }
  button {
    background:linear-gradient(180deg, #60a5fa, var(--acc2));
    color:#fff; border:0; border-radius:8px; padding:8px 14px;
    font-weight:650; cursor:pointer; font-size:13px; font-family:inherit;
    transition:transform .12s ease, filter .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); }
  button.ghost {
    background:rgba(59,130,246,.08); color:#93c5fd; border:1px solid var(--line2);
  }
  button.ghost:hover:not(:disabled) { border-color:var(--acc); background:rgba(59,130,246,.14); }
  button.danger { background:transparent; color:var(--bad); border:1px solid rgba(239,68,68,.35); }
  button.danger:hover:not(:disabled) { background:rgba(239,68,68,.1); }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  input,select {
    background:rgba(10,16,28,.72); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; font-size:14px; width:100%; font-family:inherit;
  }
  input:focus,select:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .row { display:flex; gap:10px; align-items:center; }
  .crumbs {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin:0 0 14px; color:var(--dim); font-size:13px;
  }
  .crumbs a { color:#93c5fd; cursor:pointer; text-decoration:none; font-weight:500; }
  .crumbs a:hover { text-decoration:underline; }
  .tile {
    background:linear-gradient(165deg, rgba(28,45,66,.95), rgba(15,26,40,.98));
    border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .tile:hover {
    border-color:rgba(59,130,246,.55); transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,0,0,.28), 0 0 0 1px rgba(59,130,246,.12);
  }
  .tile .n { font-weight:700; margin-bottom:6px; font-size:14.5px; }
  .tile .c { color:var(--dim); font-size:12px; }
  .section-head {
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
    flex-wrap:wrap; margin-bottom:14px;
  }
  .section-head h3 { margin:0; }
  .section-head .sub { color:var(--dim); font-size:12.5px; font-weight:400; margin-top:2px; }
  .fleet-map {
    height:min(70vh, 640px); min-height:420px; width:100%; border-radius:var(--r);
    border:1px solid var(--line); overflow:hidden; background:#0d1524;
  }
  .fleet-map .leaflet-container { height:100%; width:100%; background:#0d1524; font:inherit; }
  .map-legend { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 0; font-size:12.5px; color:var(--dim); }
  .map-legend span { display:inline-flex; align-items:center; gap:6px; }
  .map-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .map-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .map-filters label { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); cursor:pointer; user-select:none; }
  .map-filters input { accent-color:var(--acc); }
  .empty {
    grid-column:1/-1; text-align:center; color:var(--dim);
    padding:36px 16px; border:1px dashed var(--line); border-radius:14px;
    background:rgba(10,16,28,.28);
  }
  .cam {
    background:linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,.18);
  }
  .cam .vid {
    position:relative; aspect-ratio:16/9; background:#02060b; display:flex;
    align-items:center; justify-content:center; cursor:pointer;
  }
  .cam video { width:100%; height:100%; object-fit:contain; }
  .cam .meta {
    padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px;
    border-top:1px solid var(--line);
  }
  .cam .meta .nm { font-weight:650; font-size:13.5px; }
  .cam .meta .loc { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .playbtn {
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(180deg, #60a5fa, var(--acc2));
    display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.35);
  }
  .vstat {
    position:absolute; bottom:10px; left:10px; font-size:11px; background:rgba(0,0,0,.62);
    padding:3px 9px; border-radius:6px; border:1px solid rgba(255,255,255,.08);
  }
  .modal-bg {
    position:fixed; inset:0; background:rgba(2,8,14,.72); display:flex;
    align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(4px);
  }
  .modal {
    background:linear-gradient(180deg, #1a2a3d, #121a2b);
    border:1px solid var(--line2); border-radius:16px;
    padding:24px; width:min(640px,94vw); max-height:90vh; overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  .modal h2 { font-size:17px; margin-bottom:8px; }
  .modal.wide { width:min(760px,96vw); }
  .hs-steps { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; }
  .hs-steps span { font-size:12px; color:var(--dim); padding:4px 10px; border:1px solid var(--line); border-radius:999px; }
  .hs-steps span.on { color:#93c5fd; border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); }
  .hs-idle { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .hs-idle input { text-align:center; }
  .hs-idle .lbl { font-size:10px; color:var(--dim); text-align:center; margin-top:2px; }
  .chk-row { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--txt); }
  .chk-row input { width:auto; accent-color:var(--acc); }
  label { display:block; color:var(--dim); font-size:12px; margin:12px 0 5px; font-weight:500; }
  pre {
    background:rgba(10,16,28,.7); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; overflow:auto; font-size:12px; white-space:pre-wrap;
    font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  .copy { float:right; font-size:11px; padding:4px 9px; }
  .content .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; position:static; background:transparent; border:0; padding:0; backdrop-filter:none; }
  .login {
    max-width:400px; width:100%; margin:0 auto; padding:28px 26px;
    background:linear-gradient(180deg, rgba(28,45,66,.95), rgba(14,24,38,.98));
    border:1px solid var(--line2); border-radius:18px; box-shadow:var(--shadow);
  }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img { height:48px; width:auto; object-fit:contain; }
  .brand .title { line-height:1.2; min-width:0; }
  .brand .title b { display:block; font-size:17px; letter-spacing:.01em; }
  .brand .title span { color:var(--dim); font-size:12px; }
  .login-brand { text-align:center; margin-bottom:20px; }
  .login-brand img { height:112px; width:auto; max-width:100%; object-fit:contain; margin:0 auto 10px; display:block; }
  .login-brand .name { font-size:21px; font-weight:750; letter-spacing:.03em; }
  .login-brand .tag { color:var(--dim); font-size:12.5px; margin-top:4px; }

  /* ── Public landing (ads / products) ── */
  .land {
    min-height:100vh; color:var(--txt);
    background:
      radial-gradient(ellipse 90% 60% at 10% -10%, rgba(34,197,94,.18), transparent 55%),
      radial-gradient(ellipse 70% 50% at 95% 20%, rgba(59,130,246,.16), transparent 50%),
      linear-gradient(165deg, #061018 0%, #0a1624 45%, #0c1a14 100%);
  }
  .land-top {
    position:fixed; inset:0 0 auto 0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; pointer-events:none;
  }
  .land-top .land-logo {
    pointer-events:auto; display:flex; align-items:center; gap:10px;
    text-decoration:none; color:var(--txt);
  }
  .land-top .land-logo img { height:40px; width:auto; }
  .land-top .land-logo b {
    font-family:Syne,IBM Plex Sans,sans-serif; font-size:15px; font-weight:700;
    letter-spacing:.02em;
  }
  .land-login-btn {
    pointer-events:auto; position:fixed; top:50%; right:0; z-index:40;
    transform:translateY(-50%);
    writing-mode:vertical-rl; text-orientation:mixed;
    background:linear-gradient(180deg,#22c55e,#16a34a);
    color:#052e16; border:0; border-radius:10px 0 0 10px;
    padding:18px 10px; font-weight:800; font-size:13px; letter-spacing:.12em;
    box-shadow:-4px 0 24px rgba(34,197,94,.35); cursor:pointer;
  }
  .land-login-btn:hover { filter:brightness(1.08); }
  .land-hero {
    min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end;
    padding:100px 24px 56px; max-width:1100px; margin:0 auto;
    position:relative;
  }
  .land-hero::before {
    content:""; position:absolute; inset:8% 5% auto auto; width:min(420px,50vw); height:min(420px,50vw);
    border-radius:50%; background:radial-gradient(circle, rgba(251,191,36,.12), transparent 70%);
    pointer-events:none;
  }
  .land-hero .eyebrow {
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#86efac; font-weight:600;
    margin-bottom:14px;
  }
  .land-hero h1 {
    font-family:Syne,IBM Plex Sans,sans-serif;
    font-size:clamp(36px,7vw,64px); font-weight:800; line-height:1.05;
    letter-spacing:-.02em; max-width:14ch; margin:0 0 16px;
  }
  .land-hero .lead {
    font-size:clamp(15px,2.2vw,18px); color:#b8c9db; max-width:36ch; margin:0 0 28px; line-height:1.45;
  }
  .land-cta { display:flex; flex-wrap:wrap; gap:12px; }
  .land-cta a, .land-cta button {

<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

let TOKEN = sessionStorage.getItem('cctv_token') || '';
/** Empty = site root (https://jmtechsolution.cloud/). Legacy /cctv still works if proxied. */
const BASE = (() => {
  const m = location.pathname.match(/^(\/cctv)(?:\/|$)/);
  return m ? m[1] : '';
})();
const LOGO = BASE + '/logo.png';
const payUrl = (deviceId) => location.origin + BASE + '/pay/' + deviceId;

function BrandMark({ large }) {
  if (large) return html`<div class="login-brand">
    <img src=${LOGO} alt="JM TECH SOLUTION" />
    <div class="name">JM TECH SOLUTION</div>
    <div class="tag">CCTV · VPN · Remote Monitoring</div>
  </div>`;
  return html`<div class="brand">
    <img src=${LOGO} alt="JM TECH SOLUTION" />
    <div class="title"><b>JM TECH SOLUTION</b><span>Remote Monitoring Portal</span></div>
  </div>`;
}

async function api(path, opts = {}) {
  const res = await fetch(BASE + '/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opts.headers||{}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && path !== '/login') { TOKEN=''; sessionStorage.removeItem('cctv_token'); sessionStorage.removeItem('cctv_user'); location.reload(); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const fmt = d => d ? new Date(d).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : 'Never';
async function copyTxt(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (!ok) throw new Error('copy failed');
  };
  try {
    if (navigator.clipboard?.writeText && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      fallback();
    }
    return true;
  } catch {
    try { fallback(); return true; } catch { alert('Copy failed — select the text in the box and press Ctrl+C'); return false; }
  }
}
async function copyScript(text) {
  if (await copyTxt(text)) alert('Script copied to clipboard!');
}
const upSec = s => { const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return (d?d+'d ':'')+(h?h+'h ':'')+m+'m'; };

async function delGeo(level, id, label, reload) {
  if (!confirm(`Delete "${label}"?\n\nKasama LAHAT ng cities, municipals, barangays, at CCTV sa loob.`)) return;
  try {
    await api('/geo/'+level+'/'+id, { method: 'DELETE' });
    await reload();
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

function LatLngFields({ lat, lng, onChange, hint }) {
  return html`<div>
    <label>Map location <span class="dim">(lat, lng)</span></label>
    <div class="row">
      <div style=${{flex:1}}>
        <input class="mono" value=${lat ?? ''} placeholder="11.0050"
          onInput=${e=>onChange({ lat: e.target.value, lng })} />
      </div>
      <div style=${{flex:1}}>
        <input class="mono" value=${lng ?? ''} placeholder="122.7500"
          onInput=${e=>onChange({ lat, lng: e.target.value })} />
      </div>
    </div>
    <p class="dim" style=${{margin:'4px 0 0',fontSize:'12px'}}>
      ${hint || 'Right-click sa Google Maps → copy coordinates. Blanko = walang pin.'}
    </p>
  </div>`;
}

function parseFormLatLng(lat, lng) {
  const a = String(lat ?? '').trim();
  const b = String(lng ?? '').trim();
  if (!a && !b) return { lat: null, lng: null };
  return { lat: a === '' ? null : Number(a), lng: b === '' ? null : Number(b) };
}

let _gmapsPromise = null;
function loadGoogleMaps(key) {
  if (!key) return Promise.resolve(null);
  if (window.google?.maps) return Promise.resolve(window.google.maps);
  if (_gmapsPromise) return _gmapsPromise;
  _gmapsPromise = new Promise((resolve, reject) => {
    const cb = '__jmGmapsReady';
    window[cb] = () => resolve(window.google.maps);
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&callback=' + cb;
    s.onerror = () => { _gmapsPromise = null; reject(new Error('Google Maps failed to load')); };
    document.head.appendChild(s);
  });
  return _gmapsPromise;
}

const MAP_COLORS = { vendo:'#f59e0b', cctv:'#3b82f6', vpn:'#22c55e' };

function FleetMap({ stations = [], cameras = [], vendos = [], onOpenStation, onOpenWall }) {
  const mapEl = useRef(null);
  const mapRef = useRef(null);
  const [layers, setLayers] = useState({ vendo:true, cctv:true, vpn:true });
  const [engine, setEngine] = useState('loading'); // google | leaflet | error
  const [cfg, setCfg] = useState(null);
  const [err, setErr] = useState('');

  const markers = [];
  if (layers.vpn) {
    for (const s of stations) {
      if (s.lat == null || s.lng == null) continue;
      markers.push({
        id: 'vpn-'+s.id, type:'vpn', title: s.name,
        subtitle: 'VPN · ' + (s.online ? 'online' : 'offline') + ' · ' + (s.cameraCount||0) + ' cam',
        lat: Number(s.lat), lng: Number(s.lng), online: !!s.online,
        action: () => onOpenStation?.(s.id),
      });
    }
  }
  if (layers.cctv) {
    for (const c of cameras) {
      if (c.lat == null || c.lng == null) continue;
      markers.push({
        id: 'cam-'+c.id, type:'cctv', title: c.name,
        subtitle: [c.brand, c.barangay, c.station].filter(Boolean).join(' · '),
        lat: Number(c.lat), lng: Number(c.lng), online: !!c.live,
        action: () => onOpenWall?.(),
      });
    }
  }
  if (layers.vendo) {
    for (const v of vendos) {
      if (v.lat == null || v.lng == null) continue;
      markers.push({
        id: 'gas-'+v.id, type:'vendo', title: v.name,
        subtitle: 'Gasoline · ' + (v.deviceId||'') + (v.online ? ' · online' : ''),
        lat: Number(v.lat), lng: Number(v.lng), online: !!v.online,
        action: null,
      });
    }
  }

  const missing = {
    vpn: stations.filter(s => s.lat == null || s.lng == null).length,
    cctv: cameras.filter(c => c.lat == null || c.lng == null).length,
    vendo: vendos.filter(v => v.lat == null || v.lng == null).length,
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const m = await api('/settings/maps');
        if (cancelled) return;
        setCfg(m);
        if (m.configured && m.googleMapsApiKey) {
          try {
            await loadGoogleMaps(m.googleMapsApiKey);
            if (!cancelled) setEngine('google');
          } catch {
            if (!cancelled) setEngine('leaflet');
          }
        } else {
          setEngine('leaflet');
        }
      } catch (e) {
        if (!cancelled) { setErr(e.message); setEngine('leaflet'); }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (engine === 'loading' || !mapEl.current) return;
    const center = cfg?.defaultCenter || { lat: 11.0, lng: 122.5 };
    const zoom = cfg?.defaultZoom || 7;

    // teardown previous
    if (mapRef.current?.kind === 'google') {
      mapRef.current = null;
      mapEl.current.innerHTML = '';
    } else if (mapRef.current?.kind === 'leaflet') {
      mapRef.current.map.remove();
      mapRef.current = null;
      mapEl.current.innerHTML = '';
    }

    if (engine === 'google' && window.google?.maps) {
      const map = new google.maps.Map(mapEl.current, {
        center, zoom, mapTypeControl: false, streetViewControl: false,
        fullscreenControl: true, styles: [{ featureType:'poi', stylers:[{ visibility:'off' }] }],
      });
      const bounds = new google.maps.LatLngBounds();
      const gMarkers = [];
      for (const m of markers) {
        const marker = new google.maps.Marker({
          position: { lat: m.lat, lng: m.lng },
          map,
          title: m.title,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: MAP_COLORS[m.type],
            fillOpacity: 1,
            strokeColor: '#0a101c',
            strokeWeight: 2,
          },
        });
        const info = new google.maps.InfoWindow({
          content: `<div style="color:#111;font:13px/1.4 sans-serif;max-width:220px">
            <b>${m.title}</b><br/><span style="color:#555">${m.subtitle||''}</span>
            <div style="margin-top:6px;font-size:11px;color:#888">${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</div>
          </div>`,
        });
        marker.addListener('click', () => {
          info.open({ map, anchor: marker });
          m.action?.();
        });
        gMarkers.push(marker);
        bounds.extend(marker.getPosition());
      }
      if (markers.length) map.fitBounds(bounds, 48);
      mapRef.current = { kind:'google', map, gMarkers };
    } else if (window.L) {
      const map = L.map(mapEl.current, { scrollWheelZoom: true }).setView([center.lat, center.lng], zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);
      const group = [];
      for (const m of markers) {
        const pin = L.circleMarker([m.lat, m.lng], {
          radius: 9, color: '#0a101c', weight: 2,
          fillColor: MAP_COLORS[m.type], fillOpacity: 1,
        }).addTo(map);
        pin.bindPopup(`<b>${m.title}</b><br/>${m.subtitle||''}<br/><small>${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</small>`);
        pin.on('click', () => m.action?.());
        group.push(pin);
      }
      if (group.length) {
        const g = L.featureGroup(group);
        map.fitBounds(g.getBounds().pad(0.2));
      }
      mapRef.current = { kind:'leaflet', map };
      setTimeout(() => map.invalidateSize(), 80);
    }
    return () => {
      if (mapRef.current?.kind === 'leaflet') {
        mapRef.current.map.remove();
        mapRef.current = null;
      } else if (mapRef.current?.kind === 'google') {
        mapRef.current = null;
        if (mapEl.current) mapEl.current.innerHTML = '';
      }
    };
  }, [engine, cfg, layers.vendo, layers.cctv, layers.vpn, stations, cameras, vendos]);

  const pinned = markers.length;
  const total = stations.length + cameras.length + vendos.length;

  return html`<div>
    <div class="section-head">
      <div>
        <h3>Fleet Map</h3>
        <div class="sub">${pinned} pinned · ${total} assets ·
          ${engine==='google'?'Google Maps':engine==='leaflet'?'OpenStreetMap (add Google Maps API key in Settings)':engine}
        </div>
      </div>
      <div class="map-filters">
        <label><input type="checkbox" checked=${layers.vendo} onChange=${e=>setLayers({...layers,vendo:e.target.checked})} /> Vendo</label>
        <label><input type="checkbox" checked=${layers.cctv} onChange=${e=>setLayers({...layers,cctv:e.target.checked})} /> CCTV</label>
        <label><input type="checkbox" checked=${layers.vpn} onChange=${e=>setLayers({...layers,vpn:e.target.checked})} /> VPN</label>
      </div>
    </div>
    ${err && html`<div class="err" style=${{marginBottom:'10px'}}>${err}</div>`}
    <div class="fleet-map" ref=${mapEl}></div>
    <div class="map-legend">
      <span><i class="map-dot" style=${{background:MAP_COLORS.vendo}}></i> Gasoline vendo</span>
      <span><i class="map-dot" style=${{background:MAP_COLORS.cctv}}></i> CCTV</span>
      <span><i class="map-dot" style=${{background:MAP_COLORS.vpn}}></i> VPN client</span>
      ${(missing.vendo||missing.cctv||missing.vpn) ? html`<span style=${{marginLeft:'auto'}}>
        Walang coords: ${missing.vendo?missing.vendo+' vendo ':''}${missing.cctv?missing.cctv+' cctv ':''}${missing.vpn?missing.vpn+' vpn':''}
        — i-set ang lat/lng sa Edit.
      </span>` : ''}
    </div>
  </div>`;
}

function MapsSettingsPanel({ isSuperAdmin }) {
  const [key,setKey]=useState('');
  const [masked,setMasked]=useState('');
  const [configured,setConfigured]=useState(false);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState('');
  const [err,setErr]=useState('');
  const load = useCallback(async()=>{
    try {
      const d = await api('/settings/maps');
      setConfigured(!!d.configured);
      setMasked(d.googleMapsApiKeyMasked||'');
      setKey('');
    } catch(e){ setErr(e.message); }
  },[]);
  useEffect(()=>{ load(); },[load]);
  return html`<div class="card" style=${{marginBottom:'18px'}}>
    <h3 style=${{margin:'0 0 8px'}}>Google Maps</h3>
    <p class="dim" style=${{margin:'0 0 12px',fontSize:'13px'}}>
      API key para sa Fleet Map tab. Restrict sa Google Cloud → HTTP referrers:
      <span class="mono">jmtechsolution.cloud/*</span>
    </p>
    <p class="dim" style=${{margin:'0 0 12px',fontSize:'13px'}}>
      Status: ${configured ? html`<span class="badge b-ok">configured ${masked}</span>` : html`<span class="badge b-warn">not set — using OpenStreetMap</span>`}
    </p>
    ${isSuperAdmin ? html`
      <label>Google Maps API key</label>
      <input class="mono" value=${key} onInput=${e=>setKey(e.target.value)} placeholder=${configured?'•••• leave blank to keep':'AIza…'} />
      ${err && html`<div class="err">${err}</div>`}
      ${msg && html`<div class="dim" style=${{color:'var(--ok)',marginTop:'8px'}}>${msg}</div>`}
      <div class="row" style=${{marginTop:'12px',justifyContent:'flex-end',gap:'8px'}}>
        <button class="ghost" disabled=${busy||!configured} onClick=${async()=>{
          setBusy(true); setErr(''); setMsg('');
          try {
            await api('/settings/maps',{method:'PUT',body:{googleMapsApiKey:''}});
            setMsg('Cleared — Map uses OpenStreetMap');
            await load();
          } catch(e){ setErr(e.message); }
          finally { setBusy(false); }
        }}>Clear key</button>
        <button disabled=${busy||!key.trim()} onClick=${async()=>{
          setBusy(true); setErr(''); setMsg('');
          try {
            await api('/settings/maps',{method:'PUT',body:{googleMapsApiKey:key.trim()}});
            setMsg('Saved');
            setKey('');
            await load();
          } catch(e){ setErr(e.message); }
          finally { setBusy(false); }
        }}>${busy?'Saving…':'Save Maps key'}</button>
      </div>
    ` : html`<p class="dim">Super admin lang ang pwedeng mag-set ng API key.</p>`}
  </div>`;
}

// ---------- Live player ----------
function Player({ cam }) {
  const vidRef = useRef(null);
  const hlsRef = useRef(null);
  const [state, setState] = useState('idle');
  const stop = useCallback(() => { hlsRef.current?.destroy(); hlsRef.current=null; setState('idle'); }, []);
  const play = () => {
    if (!cam.live) return;
    setState('loading');
    const video = vidRef.current;
    if (Hls.isSupported()) {
      const hls = new Hls({ liveDurationInfinity:true, manifestLoadingMaxRetry:4 });
      hlsRef.current = hls;
      hls.loadSource(cam.hlsUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); setState('playing'); });
      hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { stop(); setState('error'); } });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = cam.hlsUrl; video.play().then(()=>setState('playing')).catch(()=>setState('error'));
    }
  };
  useEffect(() => stop, [stop]);
  const brandLabel = (CAM_BRANDS.find(b=>b.id===cam.brand)||{}).label || cam.brand || '';
  return html`<div class="cam">
    <div class="vid" onClick=${() => state==='idle'||state==='error' ? play() : null}>
      <video ref=${vidRef} muted playsInline controls=${state==='playing'}
             style=${{display: state==='playing'||state==='loading' ? 'block':'none'}}></video>
      ${state==='idle' && html`<div class="playbtn">${cam.live ? '▶' : '✕'}</div>`}
      ${state==='loading' && html`<div class="vstat">Connecting…</div>`}
      ${state==='error' && html`<div class="vstat" style=${{color:'var(--bad)'}}>Stream error — tap to retry</div>`}
      ${!cam.live && state==='idle' && html`<div class="vstat">station offline/disabled</div>`}
      ${state==='playing' && html`<button class="ghost" style=${{position:'absolute',top:'8px',right:'8px',fontSize:'11px',padding:'3px 8px'}}
        onClick=${e => { e.stopPropagation(); stop(); }}>stop</button>`}
      ${brandLabel && html`<span style=${{position:'absolute',top:'8px',left:'8px',fontSize:'10px',padding:'2px 7px',
        background:'rgba(0,0,0,.55)',borderRadius:'4px',letterSpacing:'.04em'}}>${brandLabel}</span>`}
    </div>
    <div class="meta">
      <div>
        <div class="nm">${cam.name}</div>
        <div class="loc">${[cam.station, cam.barangay, cam.municipality, cam.city, cam.province].filter(Boolean).join(' • ')}</div>
      </div>
      <span class="dot ${cam.live ? 'on':'off'}"></span>
    </div>
  </div>`;
}

function BrgyMultiSelect({ geo, value, onChange }) {
  const ids = (value || []).map(Number).filter(Boolean);
  const selected = new Set(ids);
  const toggle = id => {
    const n = new Set(selected);
    const num = Number(id);
    if (n.has(num)) n.delete(num); else n.add(num);
    onChange([...n]);
  };
  const barangays = geo?.barangays || [];
  const municipalities = geo?.municipalities || [];
  const cities = geo?.cities || [];
  const provinces = geo?.provinces || [];
  return html`<div style=${{maxHeight:'220px',overflow:'auto',border:'1px solid var(--line)',borderRadius:'8px',padding:'8px'}}>
    ${barangays.map(b => {
      const m = municipalities.find(x=>x.id===b.municipality_id);
      const c = cities.find(x=>x.id===m?.city_id);
      const p = provinces.find(x=>x.id===c?.province_id);
      return html`<label key=${b.id} style=${{display:'block',margin:'4px 0',cursor:'pointer',fontSize:'13px'}}>
        <input type="checkbox" checked=${selected.has(Number(b.id))} onChange=${()=>toggle(b.id)} />
        ${' '}${[p?.name,c?.name,m?.name,b.name].filter(Boolean).join(' / ')}
      </label>`;
    })}
    ${!barangays.length && html`<div class="dim">Wala pang barangay — gumawa muna sa Locations tab.</div>`}
  </div>`;
}

function brgyLabels(geo, ids) {
  return (ids||[]).map(id => {
    const b = geo?.barangays?.find(x=>x.id===id);
    if (!b) return '#'+id;
    const m = geo.municipalities.find(x=>x.id===b.municipality_id);
    const c = geo.cities.find(x=>x.id===m?.city_id);
    return [c?.name, m?.name, b.name].filter(Boolean).join(' / ');
  }).join('; ') || '—';
}

function preferEnglish(q) {
  const t = String(q || '').toLowerCase();
  const tl = /\b(ano|paano|magkano|salamat|kumusta|po|ba|ngayon|gusto|kailangan|tungkol|pwede|meron|wala|salamat|magtanong|magkano)\b/.test(t);
  const en = /\b(what|how|much|price|tell|about|please|hello|can|you|the|is|are|do|does|want|need|cost|where|when)\b/.test(t);
  return en && !tl;
}

function LandingChat() {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([
    { who: 'bot', text: 'Hi! / Kumusta! Ako ang JM TECH assistant. Magtanong sa English o Tagalog tungkol sa gasoline vendo, CCTV, VPN, forex, o shop. (JM WIFI → jmwifi.pro/apply)' },
  ]);
  const [text, setText] = useState('');
  const box = useRef(null);
  useEffect(() => {
    if (box.current) box.current.scrollTop = box.current.scrollHeight;
  }, [msgs, open]);
  useEffect(() => {
    const onOpen = (ev) => {
      const topic = String(ev.detail?.topic || '').trim();
      setOpen(true);
      if (!topic) return;
      setMsgs((m) => [
        ...m,
        { who: 'me', text: topic },
        { who: 'bot', text: chatReply(topic) },
      ]);
    };
    window.addEventListener('jmtech-chat', onOpen);
    return () => window.removeEventListener('jmtech-chat', onOpen);
  }, []);
  const send = (q) => {
    const v = String(q || text).trim();
    if (!v) return;
    setMsgs((m) => [...m, { who: 'me', text: v }, { who: 'bot', text: chatReply(v) }]);
    setText('');
  };
  return html`
    ${open && html`<div class="chat-panel" id="chat">
      <header>
        <span>Ask JM TECH · EN / TL</span>
        <button type="button" onClick=${() => setOpen(false)} aria-label="Close">×</button>
      </header>
      <div class="chat-msgs" ref=${box}>
        ${msgs.map((m, i) => html`<div key=${i} class=${'chat-bubble ' + m.who}>${m.text}</div>`)}
      </div>
      <div class="chat-quick">
        ${['Gasoline vendo', 'CCTV', 'VPN', 'Forex', 'Shop', 'Magkano?'].map((q) => html`
          <button type="button" key=${q} onClick=${() => send(q)}>${q}</button>
        `)}
      </div>
      <form class="chat-input" onSubmit=${(e) => { e.preventDefault(); send(); }}>
        <input value=${text} onInput=${(e) => setText(e.target.value)} placeholder="English or Tagalog…" />
        <button type="submit">Send</button>
      </form>
    </div>`}
    <button type="button" class="chat-fab" onClick=${() => setOpen((o) => !o)} title="Chat">${open ? '×' : '💬'}</button>
  `;
}

    const [c,s] = await Promise.all([
      api('/forex/clients').catch(()=>[]),
      api('/forex/strategies').catch(()=>[]),
    ]);
    setClients(c);

  },[]);
  useEffect(()=>{ load(); },[load]);
  const stratName = (id) => (strategies.find(s=>s.id===id)||{}).name || id;
  const fmtWhen = (v) => {
    if (!v) return '—';
    try {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleString();
    } catch { return '—'; }
  };
  const addStrategy = async () => {
    const name = String(newStrat.name||'').trim();
    if (!name) return alert('Strategy name required');
    const slug = String(newStrat.slug||name).trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'-');
    await api('/forex/strategies', { method:'POST', body: { ...newStrat, name, slug } });
    setNewStrat({ name:'', slug:'', description:'', timeframe:'', riskLevel:'' });

    <div class="topbar" style=${{marginBottom:'10px'}}>

          ${(c.strategyIds||[]).map(id=>stratName(id)).join(', ')||'—'}

function suggestVlanIps(vlanId) {
  const v = Number(vlanId);
  if (!Number.isFinite(v) || v < 1) return { address:'10.10.0.1/24', ipStart:'10.10.0.10', ipEnd:'10.10.0.254' };
  return {
    address: `10.${v}.0.1/24`,
    ipStart: `10.${v}.0.10`,
    ipEnd: `10.${v}.0.254`,
  };
}

function HotspotServerModal({ wifiSites, hotspotServers = [], defaultSiteId, onClose, onDone }) {
  const maxVlan = hotspotServers.reduce((m,s)=>Math.max(m, Number(s.vlanId)||0), 100);
  const nextVlan = maxVlan + 1;
  const ips = suggestVlanIps(nextVlan);
  const [f,setF]=useState({
    siteId: defaultSiteId || (wifiSites[0]?.id ? String(wifiSites[0].id) : ''),
    name:'VLAN101', vlanId:String(nextVlan), parentInterface:'',
    serverProfile:'default', idleDays:'0', idleHours:'0', idleMinutes:'10', idleSeconds:'0',
    address: ips.address, ipStart: ips.ipStart, ipEnd: ips.ipEnd,
    masquerade:true, antiSharing:true,
  });
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const [made,setMade]=useState(null);
  const site = wifiSites.find(s => String(s.id) === String(f.siteId));
  const ifaces = [
    site?.bridgeInterface || 'bridge-local',
    'ether1','ether2','ether3','ether4','ether5','wlan1',
  ].filter((v,i,a)=>v && a.indexOf(v)===i);
  const set = k => e => setF({...f,[k]:e.target.value});
  const onVlan = e => {
    const vlanId = e.target.value;
    const sug = suggestVlanIps(vlanId);
    setF({
      ...f, vlanId,
      name: vlanId ? `VLAN${vlanId}` : f.name,
      address: sug.address, ipStart: sug.ipStart, ipEnd: sug.ipEnd,
      parentInterface: f.parentInterface || site?.bridgeInterface || 'bridge-local',
    });
  };
  if (made) return html`<div class="modal-bg"><div class="modal wide">
    <h2>Hotspot server ${made.push?.success ? 'uploaded sa MikroTik ✓' : 'saved ✓'}</h2>
    <p class="dim" style=${{fontSize:'13px'}}>${made.name} · VLAN ${made.vlanId} · ${made.parentInterface}</p>
    ${made.push?.success ? html`
      <div class="metric" style=${{marginTop:'12px'}}>
        <div class="ml">MikroTik push</div>
        <div class="ms" style=${{whiteSpace:'pre-wrap'}}>${(made.push.steps||[]).join('\n')}</div>
      </div>
      <p class="dim" style=${{fontSize:'12px',marginTop:'8px'}}>
        Client portal: <a href="/allvendo/portal/" target="_blank" rel="noopener">/allvendo/portal/</a>

    ` : made.push?.error ? html`<div class="err" style=${{marginTop:'12px'}}>
      MikroTik upload failed: ${made.push.error}
      <div class="dim" style=${{marginTop:'6px',fontSize:'12px'}}>Check: API port 8728 open, VPN online, tamang API password.</div>
    </div>` : ''}
    <h3 style=${{marginTop:'16px'}}>MikroTik script (backup)</h3>

    <div class="row" style=${{justifyContent:'flex-end',marginTop:'12px',gap:'8px'}}>

        try {
          const push = await api('/hotspot/servers/'+made.id+'/push',{method:'POST'});
          setMade({...made, push});

    setApiUser(d.apiUser||'admin');
    setApiPassword('');
    setLat(d.lat != null ? String(d.lat) : '');
    setLng(d.lng != null ? String(d.lng) : '');
  }).catch(()=>onBack()),[id]);
  useEffect(()=>{ load(); },[load]);
  if (!s) return html`<div class="dim">Loading…</div>`;
  const act = async (p,b) => { await api(`/stations/${id}${p}`,{method:'POST',body:b}); await load(); onChanged(); };
  const saveApi = async () => {
    setApiErr('');
    setApiBusy(true);
    try {
      const body = { apiUser: apiUser.trim() || 'admin' };
      if (apiPassword.trim()) body.apiPassword = apiPassword.trim();
      await api('/stations/'+id,{method:'PATCH',body});
      setApiPassword('');
      await load();
      onChanged();
    } catch(e) { setApiErr(e.message); }
    finally { setApiBusy(false); }
  };
  const saveLoc = async () => {
    setLocErr(''); setLocBusy(true);
    try {
      await api('/stations/'+id,{method:'PATCH',body: parseFormLatLng(lat, lng)});
      await load(); onChanged();
    } catch(e) { setLocErr(e.message); }
    finally { setLocBusy(false); }
  };
  const camsAsLive = s.cameras.map(c=>({...c, live: c.enabled && s.status==='active', station:s.name}));
  return html`<div>
    <div class="topbar">
      <h1><a style=${{color:'var(--acc)',cursor:'pointer'}} onClick=${onBack}>←</a> ${s.name}
        <span class="badge b-${s.status}" style=${{marginLeft:'8px'}}>${s.status}</span>
        <span class="dot ${s.online?'on':'off'}" style=${{marginLeft:'8px'}}></span><span class="dim" style=${{fontSize:'12px'}}>${s.online?'online':'offline'}</span></h1>
      <div class="row">
        <input type="number" style=${{width:'80px'}} value=${days} onInput=${e=>setDays(e.target.value)} />
        <button class="ghost" onClick=${()=>act('/extend',{days:Number(days)})}>Extend</button>
        <button class="ghost" onClick=${()=>act('/extend',{days:null})}>No expiry</button>
        ${s.status==='active'
          ? html`<button class="danger" onClick=${()=>act('/disable')}>Disable</button>`
          : html`<button onClick=${()=>act('/enable').catch(()=>alert('Expired — use Extend'))}>Enable</button>`}
      </div>
    </div>
    <div class="crumbs">
      <span>Winbox: <b class="mono" style=${{color:'var(--txt)'}}>${s.vpnAddress}</b>
      <button class="ghost copy" onClick=${()=>copyTxt(s.vpnAddress)}>copy</button></span>
      <span>• Billing API: <b class="mono" style=${{color:'var(--txt)'}}>${s.apiAddress}</b>
      <button class="ghost copy" onClick=${()=>copyTxt(s.apiAddress)}>copy</button></span>
      <span>• API user: <b class="mono" style=${{color:'var(--txt)'}}>${s.apiUser||'admin'}</b></span>
      <span>• Expires: ${fmt(s.expiration)}</span>
      ${s.lat!=null&&s.lng!=null?html`<span>• Map: <b class="mono" style=${{color:'var(--txt)'}}>${Number(s.lat).toFixed(5)}, ${Number(s.lng).toFixed(5)}</b></span>`:html`<span class="dim">• Map: not set</span>`}
    </div>
    <div class="card" style=${{marginBottom:'16px'}}>
      <h3>Map location</h3>
      <p class="dim" style=${{margin:'0 0 12px',fontSize:'13px'}}>Lalabas sa Fleet Map. CCTV sa VPN na ito ay pwedeng gumamit ng location na ito kung walang sariling coords.</p>
      <${LatLngFields} lat=${lat} lng=${lng} onChange=${({lat:a,lng:b})=>{setLat(a);setLng(b);}} />
      ${locErr && html`<div class="err">${locErr}</div>`}
      <div class="row" style=${{marginTop:'12px',justifyContent:'flex-end'}}>
        <button onClick=${saveLoc} disabled=${locBusy}>${locBusy?'Saving…':'Save location'}</button>
      </div>
    </div>
    <div class="card" style=${{marginBottom:'16px'}}>
      <h3>Billing API credentials</h3>
      <p class="dim" style=${{margin:'0 0 12px',fontSize:'13px'}}>Ilagay ang MikroTik RouterOS API user/password para sa JM billing — konekta sa <span class="mono">${s.apiAddress}</span></p>
      <div class="row">
        <div style=${{flex:1}}><label>API username</label><input value=${apiUser} onInput=${e=>setApiUser(e.target.value)} class="mono" /></div>
        <div style=${{flex:1}}><label>API password <span class="dim">(blanko = hindi palitan)</span></label><input value=${apiPassword} onInput=${e=>setApiPassword(e.target.value)} placeholder=${s.apiPassword ? '••••••••' : 'hindi pa naka-set'} class="mono" /></div>
      </div>
      ${apiErr && html`<div class="err">${apiErr}</div>`}
      <div class="row" style=${{marginTop:'12px',justifyContent:'flex-end'}}>
        <button onClick=${saveApi} disabled=${apiBusy}>${apiBusy?'Saving…':'Save API credentials'}</button>
      </div>
    </div>
    <div class="card" style=${{marginBottom:'16px'}}>
      <h3>MikroTik SSTP VPN script <button type="button" class="ghost copy" onClick=${e=>{e.stopPropagation(); copyScript(s.routerosScript);}}>copy all</button></h3>
      <pre>${s.routerosScript}</pre>
      <div class="dim" style=${{fontSize:'12px'}}>SSTP: <span class="mono">${s.sstpServer}:${s.sstpPort}</span> · User: <span class="mono">${s.username}</span> · Pass: <span class="mono">${s.password}</span> · Tunnel IP: <span class="mono">${s.vpnIp}</span></div>
    </div>
    <div class="topbar" style=${{marginBottom:'10px'}}>
      <h3>Cameras on this VPN (${s.cameras.length})</h3>
    </div>
    <div class="grid g-cams">
      ${camsAsLive.map(c => html`<div key=${c.id}>
        <${Player} cam=${c} />
        <div class="row" style=${{marginTop:'6px',justifyContent:'space-between'}}>
          <span class="dim mono" style=${{fontSize:'11px'}}>${c.lanIp}:${c.rtspPort} ⇄ :${c.tunnelPort}</span>
          <div class="row">
            <button class="ghost" style=${{fontSize:'11px',padding:'3px 8px'}}
              onClick=${async()=>{await api('/cameras/'+c.id,{method:'PATCH',body:{enabled:!c.enabled}}); load();}}>${c.enabled?'disable':'enable'}</button>
            <button class="danger" style=${{fontSize:'11px',padding:'3px 8px'}}
              onClick=${async()=>{if(confirm('Delete camera '+c.name+'?')){await api('/cameras/'+c.id,{method:'DELETE'}); load();}}}>✕</button>
          </div>
        </div></div>`)}
      ${s.cameras.length===0 && html`<div class="dim">Walang camera na naka-link sa VPN client na ito. Mag-add ng CCTV sa Locations tab.</div>`}
    </div>
  </div>`;
}

function PaymongoSettingsPanel({ isSuperAdmin }) {
  const [data,setData]=useState(null);
  const [f,setF]=useState({enabled:false,mode:'test',publicKey:'',secretKey:'',webhookSecret:''});
  const [err,setErr]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const load = useCallback(async()=>{
    try {
      const d = await api('/settings/paymongo');
      setData(d);
      setF({
        enabled: !!d.settings?.enabled,
        mode: d.settings?.mode || 'test',
        publicKey: d.settings?.publicKey || '',
        secretKey: '',
        webhookSecret: '',
      });
    } catch(e){ setErr(e.message); }
  },[]);
  useEffect(()=>{ load(); },[load]);
  const set = k => e => setF({...f,[k]: e.target.type==='checkbox'?e.target.checked:e.target.value});
  if (!data && !err) return html`<div class="dim">Loading PayMongo settings…</div>`;
  return html`<div>
    <div class="card" style=${{marginBottom:'14px'}}>
      <div class="topbar"><h3>PayMongo Webhook</h3>
        <button class="ghost" onClick=${load}>Refresh</button></div>
      <p class="dim" style=${{fontSize:'13px',margin:'0 0 12px'}}>
        Secret key at webhook signing secret ay <b>sa server lang</b>. I-paste ang URL na ito sa PayMongo Dashboard → Developers → Webhooks.
      </p>
      <label>Webhook URL</label>
      <div class="row" style=${{gap:'8px',alignItems:'center'}}>
        <input class="mono" style=${{flex:1}} readonly value=${data?.webhookUrl||''} />
        <button class="ghost" type="button" onClick=${async()=>{
          const ok = await copyTxt(data?.webhookUrl||'');
          if (ok) { setMsg('Webhook URL copied'); setTimeout(()=>setMsg(''),2000); }
        }}>Copy</button>
      </div>
      <div class="dim" style=${{fontSize:'12px',marginTop:'6px'}}>
        Events to enable: <span class="mono">payment.paid</span>, <span class="mono">payment.failed</span>, <span class="mono">qrph.expired</span>
      </div>
    </div>

    <div class="card" style=${{marginBottom:'14px'}}>
      <h3 style=${{marginTop:0}}>API & signing keys</h3>
      ${!isSuperAdmin && html`<p class="dim" style=${{fontSize:'13px'}}>View only — Super Admin ang pwedeng mag-save ng keys.</p>`}
      <label style=${{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
        <input type="checkbox" checked=${f.enabled} onChange=${set('enabled')} disabled=${!isSuperAdmin} />
        Enable PayMongo webhooks
      </label>
      <label>Mode</label>
      <select value=${f.mode} onChange=${set('mode')} disabled=${!isSuperAdmin}>
        <option value="test">Test</option>
        <option value="live">Live</option>
      </select>
      <label>Public key ${data?.settings?.publicKeyMasked?html`<span class="dim">(${data.settings.publicKeyMasked})</span>`:''}</label>
      <input class="mono" value=${f.publicKey} onInput=${set('publicKey')} placeholder="pk_test_…" disabled=${!isSuperAdmin} />
      <label>Secret key ${data?.settings?.secretKeyConfigured?html`<span class="dim">(configured: ${data.settings.secretKeyMasked})</span>`:html`<span class="dim">(not set)</span>`}</label>
      <input class="mono" type="password" value=${f.secretKey} onInput=${set('secretKey')}
        placeholder=${data?.settings?.secretKeyConfigured?'Leave blank to keep':'sk_test_…'} disabled=${!isSuperAdmin} autocomplete="new-password" />
      <label>Webhook signing secret ${data?.settings?.webhookSecretConfigured?html`<span class="dim">(configured: ${data.settings.webhookSecretMasked})</span>`:html`<span class="dim">(not set)</span>`}</label>
      <input class="mono" type="password" value=${f.webhookSecret} onInput=${set('webhookSecret')}
        placeholder=${data?.settings?.webhookSecretConfigured?'Leave blank to keep':'whsk_… from PayMongo webhook'} disabled=${!isSuperAdmin} autocomplete="new-password" />
      ${err && html`<div class="err">${err}</div>`}
      ${msg && html`<div class="dim" style=${{color:'var(--ok)',marginTop:'8px'}}>${msg}</div>`}
      ${isSuperAdmin && html`<div class="row" style=${{marginTop:'14px',justifyContent:'flex-end'}}>
        <button disabled=${busy} onClick=${async()=>{
          setBusy(true); setErr(''); setMsg('');
          try {
            const body = { enabled:f.enabled, mode:f.mode, publicKey:f.publicKey };
            if (f.secretKey.trim()) body.secretKey = f.secretKey.trim();
            if (f.webhookSecret.trim()) body.webhookSecret = f.webhookSecret.trim();
            const d = await api('/settings/paymongo',{method:'PUT',body});
            setData(prev => ({...prev, settings:d.settings, webhookUrl:d.webhookUrl}));
            setF(x => ({...x, secretKey:'', webhookSecret:''}));
            setMsg('Saved');
            load();
          } catch(e){ setErr(e.message); }
          finally { setBusy(false); }
        }}>${busy?'Saving…':'Save PayMongo settings'}</button>
      </div>`}
    </div>

    <div class="card" style=${{padding:0,overflowX:'auto'}}>
      <div style=${{padding:'12px 14px',borderBottom:'1px solid var(--line)'}}>
        <h3 style=${{margin:0}}>Recent webhooks</h3>
        <div class="dim" style=${{fontSize:'12px'}}>Signature check + idempotency log (duplicate events ignored)</div>
      </div>
      <table><thead><tr>
        <th>When</th><th>Event</th><th>Event ID</th><th>Valid</th><th>Dup</th><th>Processed</th><th>Error</th>
      </tr></thead>
      <tbody>
        ${(data?.recentWebhooks||[]).map(l=>html`<tr key=${l.id}>
          <td class="dim">${fmt(l.created)}</td>
          <td class="mono">${l.eventType}</td>
          <td class="mono" style=${{fontSize:'11px'}}>${l.eventId||'—'}</td>
          <td><span class="badge ${l.isValid?'b-ok':'b-warn'}">${l.isValid?'yes':'no'}</span></td>
          <td>${l.duplicate?'yes':'—'}</td>
          <td class="dim">${l.processedAt?fmt(l.processedAt):'—'}</td>
          <td class="dim" style=${{whiteSpace:'normal',maxWidth:'200px'}}>${l.error||'—'}</td>
        </tr>`)}
        ${!(data?.recentWebhooks||[]).length && html`<tr><td colSpan="7" class="dim" style=${{textAlign:'center',padding:'24px'}}>
          Wala pang webhook — i-save ang signing secret, tapos i-test sa PayMongo Dashboard.
        </td></tr>`}
      </tbody></table>
    </div>
  </div>`;
}

// ---------- VPN Server panel ----------
function ServerPanel() {
  const [st,setSt]=useState(null); const [sess,setSess]=useState([]); const [log,setLog]=useState([]);
  const [busy,setBusy]=useState('');
  const load = useCallback(async()=>{
    const [a,b,c] = await Promise.all([api('/server/status'), api('/server/sessions'), api('/server/audit?limit=25')]);
    setSt(a); setSess(b); setLog(c);
  },[]);
  useEffect(()=>{ load(); const t=setInterval(load,30000); return ()=>clearInterval(t); },[load]);
  if (!st) return html`<div class="dim">Loading…</div>`;
  const doAct = async (label, fn) => { setBusy(label); try { await fn(); await load(); } catch(e){ alert(e.message); } setBusy(''); };
  const svcBadge = v => html`<span class="badge ${v==='active'?'b-ok':'b-bad'}">${v}</span>`;
  return html`<div>
    <div class="statbar">
      <div class="stat"><div class="v">${st.vpn.onlineSessions}</div><div class="l">Online now</div></div>
      <div class="stat"><div class="v">${st.vpn.active}</div><div class="l">Active clients</div></div>
      <div class="stat"><div class="v" style=${{color:'var(--warn)'}}>${st.vpn.disabled}</div><div class="l">Disabled</div></div>
      <div class="stat"><div class="v" style=${{color:'var(--bad)'}}>${st.vpn.expired}</div><div class="l">Expired</div></div>
      <div class="stat"><div class="v">${st.streams.activePulls}</div><div class="l">Live streams</div></div>
      <div class="stat"><div class="v">${st.system.memUsedPct}%</div><div class="l">RAM</div></div>
      <div class="stat"><div class="v">${st.system.loadavg[0]}</div><div class="l">Load 1m</div></div>
      <div class="stat"><div class="v">${upSec(st.system.uptimeSec)}</div><div class="l">Uptime</div></div>
    </div>
    ${st.dryRun && html`<div class="card" style=${{borderColor:'var(--warn)',marginBottom:'12px'}}>⚠ DRY_RUN mode — walang totoong system changes na ina-apply.</div>`}
    <div class="card" style=${{marginBottom:'14px'}}>
      <div class="topbar">
        <h3>Services — ${st.system.hostname}</h3>
        <div class="row">
          <button class="ghost" disabled=${!!busy} onClick=${()=>doAct('sync',()=>api('/server/sync',{method:'POST'}))}>${busy==='sync'?'Applying…':'⟳ Apply config now'}</button>
          <button class="ghost" disabled=${!!busy} onClick=${()=>confirm('Restart SSTP server? Madidiskonekta sandali lahat ng clients.')&&doAct('accel',()=>api('/server/restart',{method:'POST',body:{service:'accel-ppp'}}))}>${busy==='accel'?'…':'Restart VPN server'}</button>
          <button class="ghost" disabled=${!!busy} onClick=${()=>doAct('mtx',()=>api('/server/restart',{method:'POST',body:{service:'mediamtx'}}))}>${busy==='mtx'?'…':'Restart streaming'}</button>
        </div>
      </div>
      <table style=${{marginTop:'8px'}}><tbody>
        <tr><td>SSTP VPN server (accel-ppp)</td><td>${svcBadge(st.services['accel-ppp'])}</td></tr>
        <tr><td>Streaming (MediaMTX)</td><td>${svcBadge(st.services['mediamtx'])}</td></tr>
        <tr><td>Firewall/NAT (nftables)</td><td>${svcBadge(st.services['nftables'])}</td></tr>
        <tr><td>Database (PostgreSQL)</td><td>${svcBadge(st.services['postgresql'])}</td></tr>
      </tbody></table>
    </div>
    <div class="card" style=${{marginBottom:'14px',padding:0,overflowX:'auto'}}>
      <table><thead><tr><th>Live Sessions (${sess.length})</th><th>VPN Client</th><th>Tunnel IP</th><th>Uptime</th><th></th></tr></thead>
      <tbody>${sess.map(x=>html`<tr key=${x.username}>
        <td class="mono">${x.username}</td><td>${x.station}</td>
        <td class="mono">${x.ip}</td><td>${x.uptime}</td>
        <td><button class="danger" style=${{fontSize:'11px',padding:'3px 8px'}}
          onClick=${()=>confirm('Kick session '+x.username+'?')&&doAct('kick',()=>api('/server/sessions/'+x.username+'/kick',{method:'POST'}))}>kick</button></td>
      </tr>`)}
      ${sess.length===0 && html`<tr><td colSpan="5" class="dim" style=${{textAlign:'center',padding:'20px'}}>Walang naka-connect na client ngayon.</td></tr>`}
      </tbody></table>
    </div>
    <div class="card" style=${{padding:0,overflowX:'auto'}}>
      <table><thead><tr><th>Recent Activity</th><th>Actor</th><th>When</th></tr></thead>
      <tbody>${log.map(x=>html`<tr key=${x.id}>
        <td class="mono" style=${{fontSize:'12px'}}>${x.action}${x.detail?.reason?' — '+x.detail.reason:''}</td>
        <td><span class="badge b-disabled">${x.actor}</span></td>
        <td class="dim">${fmt(x.at)}</td></tr>`)}
      </tbody></table>
    </div>
  </div>`;
}

// ---------- Main app ----------
function App() {
  const [authed,setAuthed]=useState(!!TOKEN);
  const [user,setUser]=useState(()=>{
    try { return JSON.parse(sessionStorage.getItem('cctv_user')||'null'); } catch { return null; }
  });
  const isManager = user?.role === 'admin' || user?.role === 'staff';
  const isSuperAdmin = user?.role === 'admin';
  const roleLabel = isSuperAdmin ? 'Super Admin' : isManager ? (user?.displayName || 'Staff') : (user?.displayName || 'Viewer');
  const [geo,setGeo]=useState(null);
  const [hub,setHub]=useState(null);
  const [stations,setStations]=useState([]);
  const [cams,setCams]=useState([]);
  const [ztClients,setZtClients]=useState([]);
  const [ztStatus,setZtStatus]=useState(null);
  const [gasSummary,setGasSummary]=useState({todayAmount:0,todayLiters:0,todayCount:0,totalAmount:0,totalLiters:0,salesCount:0,pricePerLiter:65,presets:[50,100,200,500]});
  const [gasSales,setGasSales]=useState([]);
  const [gasDevices,setGasDevices]=useState([]);
  const [gasOwners,setGasOwners]=useState([]);
  const [vendoData,setVendoData]=useState({
    total_revenue_today:0, active_devices:0,
    wifi:{coins_today:0,minutes_today:0,sessions_today:0,revenue_today:0,sites_count:0,servers_count:0},
    sites:[], recent_coins:[]
  });
  const [wifiSites,setWifiSites]=useState([]);
  const [hotspotServers,setHotspotServers]=useState([]);
  const [coinDevices,setCoinDevices]=useState([]);
  const [allVendoView,setAllVendoView]=useState('overview'); // overview | hotspot
  const [selectedWifiSiteId,setSelectedWifiSiteId]=useState('');
  const [tab,setTab]=useState('browse'); // browse | wall | dash | vpn | zerotier | gas | allvendo | cctv | server | accounts
  const [wallBrand,setWallBrand]=useState('all');
  const [sideOpen,setSideOpen]=useState(false);
  const dashPref = useRef(false);
  const [nav,setNav]=useState({});       // drilldown: {province, city, municipality, barangay} | {stationId, back}
  const [modal,setModal]=useState(null);
  const [q,setQ]=useState('');

  const loadAll = useCallback(async()=>{
    if (!TOKEN) return;
    try {
      const d = await api('/dashboard');
      if (d.user) {
        setUser(d.user);
        sessionStorage.setItem('cctv_user', JSON.stringify({ role:d.user.role, displayName:d.user.displayName }));
      }
      setGeo(d.geo);
      setHub(d.config);
      setStations(d.stations || []);
      setCams(d.cameras || []);
      setZtClients(d.zerotierClients || []);
      if (d.gasoline) {
        setGasSummary(s=>({...s, ...d.gasoline, presets: d.gasoline.presets || s.presets || [50,100,200,500]}));
      }
      if (d.user?.role === 'admin' || d.user?.role === 'staff') {
        api('/zerotier/status').then(setZtStatus).catch(()=>setZtStatus(null));
        api('/gasoline/sales?limit=100').then(setGasSales).catch(()=>setGasSales([]));
        api('/gasoline/devices').then(setGasDevices).catch(()=>setGasDevices([]));
        api('/gasoline/owners').then(setGasOwners).catch(()=>setGasOwners([]));
        api('/gasoline/price').then(p=>{
          if (p?.pricePerLiter != null || p?.presets) {
            setGasSummary(s=>({
              ...s,
              pricePerLiter: p.pricePerLiter ?? s.pricePerLiter,
              presets: Array.isArray(p.presets) ? p.presets : s.presets,
            }));
          }
        }).catch(()=>{});
        api('/hotspot/overview').then(d=>{
          setVendoData({
            total_revenue_today: d.total_revenue_today||0,
            active_devices: d.active_devices||0,
            wifi: {
              coins_today: d.wifi?.coins_today||0,
              minutes_today: d.wifi?.minutes_today||0,
              sessions_today: d.wifi?.sessions_today||0,
              revenue_today: d.wifi?.revenue_today||0,
              sites_count: d.wifi?.sites_count||0,
              servers_count: d.wifi?.servers_count||0,
            },
            sites: d.sites||[],
            recent_coins: d.recent_coins||[],
          });
          setWifiSites(d.sites||[]);
        }).catch(()=>{});
        api('/hotspot/servers').then(d=>setHotspotServers(d.servers||[])).catch(()=>setHotspotServers([]));
        api('/hotspot/coin-devices').then(d=>setCoinDevices(d.devices||[])).catch(()=>setCoinDevices([]));
      }
    } catch (e) {
      console.error(e);
      // Huwag burahin ang stations kung partial error — keep previous state kung may laman
      setGeo(g => g || { provinces:[], cities:[], municipalities:[], barangays:[], counts:{} });
    }
  },[]);
  useEffect(()=>{ if(authed){ loadAll(); const t=setInterval(loadAll,60000); return ()=>clearInterval(t);} },[authed,loadAll]);
  useEffect(()=>{
    if (isManager && !dashPref.current) { dashPref.current = true; setTab('dash'); }
  },[isManager]);

  if (!authed) return html`<${PublicLanding} onLoginOk=${r=>{ setUser({ role:r.role, displayName:r.displayName }); setAuthed(true); }} />`;
  if (!geo) return html`<div class="login-wrap dim">Loading…</div>`;

  const match = t => (t||'').toLowerCase().includes(q.toLowerCase());
  const openStation = (id, back) => setNav({stationId:id, back: back||{...nav}});

              <div class="c">${cnt.cameras} CCTV cameras</div>
              ${isManager && html`<div style=${{marginTop:'8px'}}><button class="danger" style=${{fontSize:'11px',padding:'2px 8px'}}
                onClick=${e=>{e.stopPropagation(); delGeo('barangays',b.id,b.name,loadAll);}}>Delete</button></div>`}
            </div>`;})}
          ${items.length===0 && html`<div class="dim">Wala pang barangay dito.</div>`}</div>`;
    } else {
      const items = cams.filter(c=>c.barangayId===barangay.id && match(c.name+c.lanIp+c.station));
      body = html`${crumbs}<div class="topbar"><h3>CCTV Cameras — ${barangay.name}</h3>
          ${isManager && html`<button onClick=${()=>setModal({type:'camera',barangay})}>+ Add CCTV Camera</button>`}</div>
        <div class="grid g-cams" style=${{marginTop:'10px'}}>
          ${items.map(c => html`<div key=${c.id}>
            <${Player} cam=${c} />
            ${isManager && html`<div class="row" style=${{marginTop:'6px',justifyContent:'space-between'}}>
              <span class="dim mono" style=${{fontSize:'11px'}}>${c.lanIp} · VPN: ${c.station}</span>
              <div class="row">
                <button class="ghost" style=${{fontSize:'11px',padding:'3px 8px'}}
                  onClick=${()=>setModal({type:'editCamera',cam:c})}>edit</button>
                <button class="ghost" style=${{fontSize:'11px',padding:'3px 8px'}}
                  onClick=${async()=>{await api('/cameras/'+c.id,{method:'PATCH',body:{enabled:!c.enabled}}); loadAll();}}>${c.enabled?'disable':'enable'}</button>
                <button class="danger" style=${{fontSize:'11px',padding:'3px 8px'}}
                  onClick=${async()=>{if(confirm('Delete camera '+c.name+'?')){await api('/cameras/'+c.id,{method:'DELETE'}); loadAll();}}}>✕</button>
              </div>
            </div>`}
          </div>`)}
          ${items.length===0 && html`<div class="dim">${isManager?'Wala pang CCTV dito — i-click ang “+ Add CCTV Camera”.':'Walang CCTV sa barangay na ito.'}</div>`}
        </div>`;
    }
  }

  return html`<div class="shell">
    <div class=${"side-backdrop"+(sideOpen?" show":"")} onClick=${()=>setSideOpen(false)}></div>
    <aside class=${"sidebar"+(sideOpen?" open":"")}>
      <div class="side-brand">
        <${BrandMark} />
      </div>
      <nav class="nav">
        ${isManager && html`<button class=${tab==='dash'&&!nav.stationId?'act':''} onClick=${()=>{goTab('dash');setNav({});}}>Dashboard</button>`}
        <button class=${tab==='browse'&&!nav.stationId?'act':''} onClick=${()=>goTab('browse')}>${isManager?'Locations':'My Barangays'}</button>
        <button class=${tab==='wall'&&!nav.stationId?'act':''} onClick=${()=>goTab('wall')}>Live Wall</button>
        <button class=${tab==='map'&&!nav.stationId?'act':''} onClick=${()=>goTab('map')}>Fleet Map</button>
        ${isManager && html`<div class="nav-sec">Operations</div>`}
        ${isManager && html`<button class=${tab==='cctv'&&!nav.stationId?'act':''} onClick=${()=>goTab('cctv')}>CCTV</button>`}
        ${isManager && html`<button class=${tab==='vpn'&&!nav.stationId?'act':''} onClick=${()=>goTab('vpn')}>VPN Clients</button>`}
        ${isManager && html`<button class=${tab==='zerotier'&&!nav.stationId?'act':''} onClick=${()=>goTab('zerotier')}>ZeroTier</button>`}
        ${isManager && html`<button class=${tab==='gas'&&!nav.stationId?'act':''} onClick=${()=>goTab('gas')}>Gasoline Vendo</button>`}
        ${isManager && html`<button class=${tab==='allvendo'&&!nav.stationId?'act':''} onClick=${()=>goTab('allvendo')}>ALL VENDO</button>`}
        ${isManager && html`<a class="nav-ext" href="/shop" target="_blank" rel="noopener">JM Market</a>`}
        ${isManager && html`<button class=${tab==='settings'&&!nav.stationId?'act':''} onClick=${()=>goTab('settings')}>Settings</button>`}
        ${isManager && html`<button class=${tab==='accounts'&&!nav.stationId?'act':''} onClick=${()=>goTab('accounts')}>Accounts</button>`}
        ${isManager && html`<button class=${tab==='server'&&!nav.stationId?'act':''} onClick=${()=>goTab('server')}>VPN Server</button>`}
      </nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="menu-btn" type="button" onClick=${()=>setSideOpen(v=>!v)} aria-label="Menu">☰</button>
        <input class="top-search" placeholder="Search…" value=${q} onInput=${e=>setQ(e.target.value)} />
        <div class="topbar-right">
          <span class="role-chip">${roleLabel}</span>
          <div class="avatar">${initials}</div>
          <button class="ghost" onClick=${()=>{ TOKEN=''; sessionStorage.removeItem('cctv_token'); sessionStorage.removeItem('cctv_user'); location.reload(); }}>Logout</button>
        </div>
      </div>
      <div class="content">
        <div class="page-head">
          <h1>${pageTitle}</h1>
          <div class="crumb">Home · ${pageTitle}</div>
        </div>
        ${body}
      </div>
    </div>
    ${modal?.type==='geo' && isManager && html`<${NameModal} title=${modal.title} onClose=${()=>setModal(null)}
      onSave=${async name=>{await api('/geo/'+modal.level,{method:'POST',body:{name,parentId:modal.parentId}}); setModal(null); loadAll();}} />`}
    ${modal?.type==='station' && isManager && html`<${StationModal} hub=${hub} onClose=${()=>setModal(null)}
      onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='zerotier' && isManager && html`<${ZeroTierModal} hub=${hub} onClose=${()=>setModal(null)}
      onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='gasSale' && isManager && html`<${GasSaleModal} onClose=${()=>setModal(null)}
      onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='espAdd' && isManager && html`<${EspAddModal}
      initialPrice=${gasSummary.pricePerLiter} initialPresets=${gasSummary.presets} owners=${gasOwners}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='espRates' && isManager && html`<${EspRatesModal}
      initialPrice=${gasSummary.pricePerLiter} initialPresets=${gasSummary.presets}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='espRename' && isManager && html`<${EspRenameModal}
      device=${modal.device} owners=${gasOwners}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='gasOwner' && isManager && html`<${GasOwnerModal}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='wifiSite' && isManager && html`<${MikrotikSiteModal}
      stations=${stations} onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='hotspotServer' && isManager && html`<${HotspotServerModal}
      wifiSites=${wifiSites} hotspotServers=${hotspotServers} defaultSiteId=${modal.siteId}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='esp8266Coin' && isManager && html`<${Esp8266CoinModal}
      wifiSites=${wifiSites} defaultSiteId=${modal.siteId}
      onClose=${()=>setModal(null)} onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='camera' && isManager && html`<${CameraModal} barangay=${modal.barangay} geo=${geo} stations=${stations} onClose=${()=>setModal(null)}
      onDone=${()=>{setModal(null); loadAll();}} />`}
    ${modal?.type==='editCamera' && isManager && html`<${CameraEditModal} cam=${modal.cam} onClose=${()=>setModal(null)}
      onDone=${()=>{setModal(null); loadAll();}} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
