<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JM TECH SOLUTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: #0f1419;
      color: #e8edf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #1a222d;
      border: 1px solid #2a3444;
      border-radius: 16px;
      padding: 32px 28px;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 20px; color: #3b82f6; margin-bottom: 4px; }
    .brand p { font-size: 13px; color: #8b9cb3; }
    label { display: block; font-size: 13px; color: #8b9cb3; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      background: #0f1419;
      border: 1px solid #2a3444;
      border-radius: 8px;
      color: #e8edf4;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .error { color: #ef4444; font-size: 13px; margin-bottom: 12px; display: none; }
    .foot { margin-top: 20px; text-align: center; font-size: 12px; color: #8b9cb3; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <h1>JM TECH SOLUTION</h1>
      <p>Remote Monitoring Portal</p>
    </div>
    <div class="error" id="error">Invalid login</div>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
    <div class="foot">jmtechsolution.cloud</div>
  </div>
  <script>
    if (sessionStorage.getItem('jmtech_auth') === '1') {
      location.href = '/dashboard/';
    }
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var user = document.getElementById('username').value.trim();
      var pass = document.getElementById('password').value;
      if (user && pass) {
        sessionStorage.setItem('jmtech_auth', '1');
        sessionStorage.setItem('jmtech_user', user);
        location.href = '/dashboard/';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
